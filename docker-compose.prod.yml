services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: nexapay_payments
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - payment_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d nexapay_payments"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  postgres-accounts:
    image: postgres:17
    environment:
      POSTGRES_DB: nexapay_accounts
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - account_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d nexapay_accounts"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  postgres-ledger:
    image: postgres:17
    environment:
      POSTGRES_DB: nexapay_ledger
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ledger_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d nexapay_ledger"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  postgres-fraud:
    image: postgres:17
    environment:
      POSTGRES_DB: nexapay_fraud
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - fraud_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d nexapay_fraud"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  postgres-auth:
    image: postgres:17
    environment:
      POSTGRES_DB: nexapay_auth
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d nexapay_auth"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  auth-service:
    image: ghcr.io/${NEXAPAY_IMAGE_OWNER}/nexapay-auth-service:${NEXAPAY_IMAGE_TAG}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-auth:5432/nexapay_auth
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      NEXAPAY_JWT_SECRET: ${NEXAPAY_JWT_SECRET}
      NEXAPAY_LOG_DIR: /var/log/nexapay
    volumes:
      - app_logs:/var/log/nexapay
    depends_on:
      postgres-auth:
        condition: service_healthy
    restart: unless-stopped

  payment-service:
    image: ghcr.io/${NEXAPAY_IMAGE_OWNER}/nexapay-payment-service:${NEXAPAY_IMAGE_TAG}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nexapay_payments
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      NEXAPAY_JWT_SECRET: ${NEXAPAY_JWT_SECRET}
      NEXAPAY_LOG_DIR: /var/log/nexapay
    volumes:
      - app_logs:/var/log/nexapay
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: unless-stopped

  account-service:
    image: ghcr.io/${NEXAPAY_IMAGE_OWNER}/nexapay-account-service:${NEXAPAY_IMAGE_TAG}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-accounts:5432/nexapay_accounts
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      NEXAPAY_JWT_SECRET: ${NEXAPAY_JWT_SECRET}
      NEXAPAY_LOG_DIR: /var/log/nexapay
    volumes:
      - app_logs:/var/log/nexapay
    depends_on:
      postgres-accounts:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: unless-stopped

  ledger-service:
    image: ghcr.io/${NEXAPAY_IMAGE_OWNER}/nexapay-ledger-service:${NEXAPAY_IMAGE_TAG}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-ledger:5432/nexapay_ledger
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      NEXAPAY_JWT_SECRET: ${NEXAPAY_JWT_SECRET}
      NEXAPAY_LOG_DIR: /var/log/nexapay
    volumes:
      - app_logs:/var/log/nexapay
    depends_on:
      postgres-ledger:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: unless-stopped

  fraud-service:
    image: ghcr.io/${NEXAPAY_IMAGE_OWNER}/nexapay-fraud-service:${NEXAPAY_IMAGE_TAG}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-fraud:5432/nexapay_fraud
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      NEXAPAY_JWT_SECRET: ${NEXAPAY_JWT_SECRET}
      NEXAPAY_LOG_DIR: /var/log/nexapay
    volumes:
      - app_logs:/var/log/nexapay
    depends_on:
      postgres-fraud:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: unless-stopped

  gateway-service:
    image: ghcr.io/${NEXAPAY_IMAGE_OWNER}/nexapay-gateway-service:${NEXAPAY_IMAGE_TAG}
    environment:
      NEXAPAY_REDIS_HOST: redis
      NEXAPAY_REDIS_PORT: 6379
      AUTH_SERVICE_URL: http://auth-service:8085
      PAYMENT_SERVICE_URL: http://payment-service:8081
      ACCOUNT_SERVICE_URL: http://account-service:8082
      LEDGER_SERVICE_URL: http://ledger-service:8083
      FRAUD_SERVICE_URL: http://fraud-service:8084
      NEXAPAY_JWT_SECRET: ${NEXAPAY_JWT_SECRET}
      NEXAPAY_LOG_DIR: /var/log/nexapay
    volumes:
      - app_logs:/var/log/nexapay
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
      payment-service:
        condition: service_started
      account-service:
        condition: service_started
      ledger-service:
        condition: service_started
      fraud-service:
        condition: service_started
    restart: unless-stopped

  frontend:
    image: ghcr.io/${NEXAPAY_IMAGE_OWNER}/nexapay-frontend:${NEXAPAY_IMAGE_TAG}
    ports:
      - "${NEXAPAY_HTTP_PORT}:80"
    depends_on:
      gateway-service:
        condition: service_started
    restart: unless-stopped

volumes:
  payment_db_data:
  account_db_data:
  ledger_db_data:
  fraud_db_data:
  auth_db_data:
  kafka_data:
  redis_data:
  app_logs:
