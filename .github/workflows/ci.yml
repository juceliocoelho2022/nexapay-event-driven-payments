name: NexaPay CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: nexapay-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · Java 21 · Maven
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Maven reactor tests
        run: mvn -B -ntp clean test

  frontend:
    name: Frontend · React · TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: npm install --package-lock=false

      - name: Type-check frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Upload production frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexapay-frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7

  compose:
    name: Docker Compose · Configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate local Docker Compose configuration
        run: docker compose config --quiet

      - name: Validate cloud-ready Docker Compose configuration
        run: docker compose --env-file .env.production.example -f docker-compose.prod.yml config --quiet

  service-images:
    name: Image · ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: backend
    strategy:
      fail-fast: false
      matrix:
        module:
          - payment-service
          - account-service
          - ledger-service
          - fraud-service
          - auth-service
          - gateway-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.service
          push: false
          build-args: |
            MODULE=${{ matrix.module }}
          tags: nexapay/${{ matrix.module }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.module }}
          cache-to: type=gha,mode=max,scope=${{ matrix.module }}

  frontend-image:
    name: Image · frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          push: false
          tags: nexapay/frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
