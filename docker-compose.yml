services:

  postgres:
    image: postgres:17
    container_name: nexapay-postgres

    environment:
      POSTGRES_DB: nexapay_payments
      POSTGRES_USER: nexapay
      POSTGRES_PASSWORD: nexapay

    ports:
      - "5435:5432"

    volumes:
      - nexapay_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexapay -d nexapay_payments"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-accounts:
    image: postgres:17
    container_name: nexapay-accounts-postgres

    environment:
      POSTGRES_DB: nexapay_accounts
      POSTGRES_USER: nexapay
      POSTGRES_PASSWORD: nexapay

    ports:
      - "5436:5432"

    volumes:
      - nexapay_accounts_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexapay -d nexapay_accounts"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-ledger:
    image: postgres:17
    container_name: nexapay-ledger-postgres

    environment:
      POSTGRES_DB: nexapay_ledger
      POSTGRES_USER: nexapay
      POSTGRES_PASSWORD: nexapay

    ports:
      - "5437:5432"

    volumes:
      - nexapay_ledger_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexapay -d nexapay_ledger"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-fraud:
    image: postgres:17
    container_name: nexapay-fraud-postgres

    environment:
      POSTGRES_DB: nexapay_fraud
      POSTGRES_USER: nexapay
      POSTGRES_PASSWORD: nexapay

    ports:
      - "5438:5432"

    volumes:
      - nexapay_fraud_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexapay -d nexapay_fraud"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-auth:
    image: postgres:17
    container_name: nexapay-auth-postgres

    environment:
      POSTGRES_DB: nexapay_auth
      POSTGRES_USER: nexapay
      POSTGRES_PASSWORD: nexapay

    ports:
      - "5439:5432"

    volumes:
      - nexapay_auth_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexapay -d nexapay_auth"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.1
    container_name: nexapay-kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

  prometheus:
    image: prom/prometheus:v3.13.1
    container_name: nexapay-prometheus

    ports:
      - "9090:9090"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"

    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - nexapay_prometheus_data:/prometheus

    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: nexapay-grafana

    ports:
      - "3000:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"

    volumes:
      - nexapay_grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro

    depends_on:
      - prometheus

    restart: unless-stopped

volumes:
  nexapay_postgres_data:
  nexapay_accounts_postgres_data:
  nexapay_ledger_postgres_data:
  nexapay_fraud_postgres_data:
  nexapay_auth_postgres_data:
  nexapay_prometheus_data:
  nexapay_grafana_data:
