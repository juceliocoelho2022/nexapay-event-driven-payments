services:

  postgres:
    image: postgres:17
    container_name: nexapay-postgres

    environment:
      POSTGRES_DB: nexapay_payments
      POSTGRES_USER: nexapay
      POSTGRES_PASSWORD: nexapay

    ports:
      - "5435:5432"

    volumes:
      - nexapay_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexapay -d nexapay_payments"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-accounts:
    image: postgres:17
    container_name: nexapay-accounts-postgres

    environment:
      POSTGRES_DB: nexapay_accounts
      POSTGRES_USER: nexapay
      POSTGRES_PASSWORD: nexapay

    ports:
      - "5436:5432"

    volumes:
      - nexapay_accounts_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexapay -d nexapay_accounts"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-ledger:
    image: postgres:17
    container_name: nexapay-ledger-postgres

    environment:
      POSTGRES_DB: nexapay_ledger
      POSTGRES_USER: nexapay
      POSTGRES_PASSWORD: nexapay

    ports:
      - "5437:5432"

    volumes:
      - nexapay_ledger_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexapay -d nexapay_ledger"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-fraud:
    image: postgres:17
    container_name: nexapay-fraud-postgres

    environment:
      POSTGRES_DB: nexapay_fraud
      POSTGRES_USER: nexapay
      POSTGRES_PASSWORD: nexapay

    ports:
      - "5438:5432"

    volumes:
      - nexapay_fraud_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexapay -d nexapay_fraud"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-auth:
    image: postgres:17
    container_name: nexapay-auth-postgres

    environment:
      POSTGRES_DB: nexapay_auth
      POSTGRES_USER: nexapay
      POSTGRES_PASSWORD: nexapay

    ports:
      - "5439:5432"

    volumes:
      - nexapay_auth_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexapay -d nexapay_auth"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.1
    container_name: nexapay-kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

volumes:
  nexapay_postgres_data:
  nexapay_accounts_postgres_data:
  nexapay_ledger_postgres_data:
  nexapay_fraud_postgres_data:
  nexapay_auth_postgres_data:
