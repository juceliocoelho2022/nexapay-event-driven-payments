server:
  port: 8084

spring:
  application:
    name: nexapay-fraud-service

  datasource:
    url: jdbc:postgresql://localhost:5438/nexapay_fraud
    username: nexapay
    password: nexapay

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: nexapay-fraud-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

logging:
  file:
    name: ${NEXAPAY_LOG_DIR:logs}/nexapay-fraud-service.log
  structured:
    format:
      console: logstash
      file: logstash
    json:
      add:
        service: ${spring.application.name}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

nexapay:
  kafka:
    resilience:
      retry-backoff-ms: 1000
      max-retries: 2
  security:
    jwt:
      issuer: https://nexapay.local/auth
      secret: ${NEXAPAY_JWT_SECRET:nexapay-local-dev-secret-2026-change-me}
