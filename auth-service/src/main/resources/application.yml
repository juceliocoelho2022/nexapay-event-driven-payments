server:
  port: 8085

spring:
  application:
    name: nexapay-auth-service

  datasource:
    url: jdbc:postgresql://localhost:5439/nexapay_auth
    username: nexapay
    password: nexapay

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

logging:
  file:
    name: ${NEXAPAY_LOG_DIR:logs}/nexapay-auth-service.log

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

nexapay:
  security:
    jwt:
      issuer: https://nexapay.local/auth
      secret: ${NEXAPAY_JWT_SECRET:nexapay-local-dev-secret-2026-change-me}
      ttl-seconds: 3600
